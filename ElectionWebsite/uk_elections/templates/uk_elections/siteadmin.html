{% extends "uk_elections/ukhome.html" %}
{% block title %}Site Admin{% endblock %}

{% block content %}

<h1>Data Import</h1>

<form method="post" action="/uk/siteadmin" enctype="multipart/form-data">
  {% csrf_token %}
  <div class="btn-row">
    <input type="file" name="myfile">
    <button type="submit">Upload</button>
  </div>
</form>

{% if status %}
<h2>Import log</h2>
<ul>
  {% for error in status %}
    <li>{{ error }}</li>
  {% endfor %}
</ul>
{% endif %}

{% endblock %}
